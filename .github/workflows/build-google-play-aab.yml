# .github/workflows/build-google-play-aab.yml
#
# Builds the CCR WORLD Google Play release bundle (.aab) and uploads it
# as a GitHub Actions artifact.

name: Build Google Play AAB

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
    tags:
      - 'v*.*.*'

env:
  UE5_ROOT: "C:/Program Files/Epic Games/UE_5.3"

jobs:
  build-google-play-aab:
    name: Build Google Play AAB (Shipping)
    runs-on: [self-hosted, Windows, UE5]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cook & package CCRGooglePlay (Shipping / Android)
        shell: cmd
        run: |
          "%UE5_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
            -project="%GITHUB_WORKSPACE%\CCR.uproject" ^
            -targetplatform=Android ^
            -target=CCRGooglePlay ^
            -configuration=Shipping ^
            -cook -build -stage -package ^
            -archive ^
            -archivedirectory="%GITHUB_WORKSPACE%\Builds\GooglePlay" ^
            -utf8output

      - name: Find AAB path
        id: find_aab
        shell: pwsh
        run: |
          $aab = Get-ChildItem -Recurse `
            -Path "$env:GITHUB_WORKSPACE\Builds\GooglePlay" `
            -Filter "*.aab" |
            Select-Object -First 1
          if (-not $aab) { Write-Error "AAB not found!"; exit 1 }
          Write-Output "AAB found: $($aab.FullName)"
          "aab_path=$($aab.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "aab_name=$($aab.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCR-google-play-aab
          path: ${{ steps.find_aab.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "CCR WORLD play ${{ github.ref_name }}"
          body: |
            ## Google Play release bundle

            Attached file: **${{ steps.find_aab.outputs.aab_name }}**

            Upload this `.aab` to Google Play Console.
          files: ${{ steps.find_aab.outputs.aab_path }}
          draft: false
          prerelease: false
