; Config/Android/ShippingAndroidGame.ini
;
; Applied ONLY when building Android in Shipping configuration.
; This produces the Google Play Store release build (AAB bundle).
;
; ┌──────────────────────────────────────────────────────────────┐
; │  GOOGLE PLAY STORE BUILD                                     │
; │  Target: CCRGooglePlay  │  Configuration: Shipping          │
; │  Output:  Android App Bundle (.aab)                          │
; └──────────────────────────────────────────────────────────────┘
;
; VERSION NOTE: StoreVersion must be incremented for every Play Console
; upload.  Update it here; the matching VersionDisplayName string is also
; set here.  DefaultEngine.ini holds the baseline values for non-Shipping
; builds — keep them in sync when cutting a new release.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; ---------- Bundle mode --------------------------------------------------
; AAB is required by Google Play for new apps since August 2021.
bEnableBundle=True
bEnableUniversalAPK=False

; ---------- Versioning ---------------------------------------------------
; Increment StoreVersion for every upload to the Play Console.
; VersionDisplayName is shown in the "App info" screen on device.
StoreVersion=2
VersionDisplayName=1.1

; ---------- Google Play integration --------------------------------------
bEnableGooglePlaySupport=True
GamesAppID=

; ---------- Security / release hardening --------------------------------
; Disable OBB verification bypass so Play Asset Delivery works correctly.
bDisableVerifyOBBOnStartUp=False

[/Script/Engine.Engine]
; Disable on-screen debug messages in the store build.
bEnableOnScreenDebugMessages=False

; Tighten the frame-rate smoother for shipping (release devices are faster).
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=22.0),UpperBound=(Type=Exclusive,Value=62.0))
