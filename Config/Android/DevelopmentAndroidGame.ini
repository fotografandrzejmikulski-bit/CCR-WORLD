; Config/Android/DevelopmentAndroidGame.ini
;
; Applied ONLY when building Android in Development configuration.
; Produces a SELF-CONTAINED APK that can be installed by tapping the file —
; no USB cable or adb required.
;
; ┌──────────────────────────────────────────────────────────────────────┐
; │  DEVELOPER / PERSONAL BUILD                                          │
; │  Target: CCRDev  │  Configuration: Development                      │
; │  Output:  Universal APK (.apk) — tap to install from Drive/email    │
; │                                                                      │
; │  How to install on device (no adb needed):                           │
; │  1. Copy the .apk to Google Drive / send via email / USB file copy  │
; │  2. On the device: Settings → Apps → Install unknown apps → allow   │
; │  3. Tap the .apk to install                                          │
; │                                                                      │
; │  The APK is also uploaded automatically as a GitHub Actions          │
; │  artifact — download it directly from the workflow run page.         │
; └──────────────────────────────────────────────────────────────────────┘

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; ---------- APK mode -----------------------------------------------------
; Universal APK so a single file works on any Arm64 test device.
bEnableBundle=False
bEnableUniversalAPK=True

; ---------- Self-contained packaging -------------------------------------
; Embed all game content (OBB data) inside the APK so no separate data
; push via adb is needed.  The APK is larger but fully standalone.
bPackageDataInsideApk=True

; Keep data in the app's private internal directory.
; This avoids the WRITE_EXTERNAL_STORAGE permission for the dev build.
bUseExternalFilesDir=False

; ---------- Versioning ---------------------------------------------------
; Developer builds use a lower StoreVersion so Play Console never confuses
; them with production uploads.  VersionDisplayName marks it as a dev build.
StoreVersion=0
VersionDisplayName=dev

; ---------- Google Play integration --------------------------------------
; Disabled in the dev build — avoids the need for a signed Google account
; during local testing.
bEnableGooglePlaySupport=False

; ---------- Developer conveniences --------------------------------------
; Skip OBB checks — irrelevant when content is inside the APK, but also
; avoids stale-OBB errors if the device previously had an OBB variant.
bDisableVerifyOBBOnStartUp=True

[/Script/Engine.Engine]
; Show on-screen debug messages so the developer can see stats and warnings.
bEnableOnScreenDebugMessages=True

[/Script/CCR.CCRDebugSubsystem]
; Enable the debug subsystem by default in dev builds so
; UCCRDebugSubsystem::DumpWorldState(), JumpToNode() etc. work without
; manually toggling bDebugEnabled from Blueprint or the console.
bDebugEnabled=True
