; Config/Android/AndroidGame.ini
;
; Applied to ALL Android builds on top of Config/DefaultGame.ini.
; Use this file for settings that must be identical in both the
; Google Play Store build and the Developer APK build.
;
; SDK versions, ApplicationDisplayName and architecture flags are the
; single authoritative source here; the corresponding entries in
; DefaultEngine.ini are kept only as fallback defaults for non-Android
; host platforms and should match these values.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Architecture: Arm64 only — covers all Android 8+ devices we target.
bBuildForArmV7=False
bBuildForArm64=True
bBuildForX86=False
bBuildForX8664=False

; Graphics: Vulkan only — required for UE5 mobile renderer.
bSupportsVulkan=True
bSupportsVulkanSM5=False
bBuildForES31=False

; Screen orientation: portrait throughout the game.
Orientation=Portrait

; Target SDK 34 (Android 14) with Min SDK 26 (Android 8.0).
; Google Play requires target SDK >= 34 from August 2024.
MinSDKVersion=26
TargetSDKVersion=34

; Keep package data in OBB / Play Asset Delivery — not inside APK.
bPackageDataInsideApk=False
bUseExternalFilesDir=True

; Display name shown on the device.
bUseDisplayName=True
ApplicationDisplayName=CCR WORLD
